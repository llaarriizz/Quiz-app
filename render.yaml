services:
  - type: web
    name: recall-api
    runtime: go
    plan: free
    rootDir: backend
    buildCommand: go build -o recall ./cmd/server
    startCommand: ./recall -addr :$PORT -db quiz.db
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GO_VERSION
        value: 1.27.0
    # Free instances have no persistent disk and spin down when idle, so the
    # SQLite database (decks, quizzes, history) resets on every deploy/restart.
    # To keep data, upgrade to a paid plan, attach a disk mounted at /var/data,
    # and change the start command to `-db /var/data/quiz.db`.
